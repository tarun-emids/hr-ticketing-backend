# Alembic configuration for the HR Desk PostgreSQL schema.
# See README: "PostgreSQL setup — Schema migrations (Alembic)".
#
# The database URL is deliberately NOT stored here: migrations always run
# against the very DATABASE_URL the backend itself uses — compose injects it
# into the backend container (`make migrate` execs Alembic in there); host-side
# runs read it from backend/.env. migrations/env.py resolves the final URL.
[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

# Empty on purpose (never hard-code credentials in a committed file);
# `alembic -x url=...` still wins over everything (scratch databases).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
args = (sys.stderr,)
class = StreamHandler
level = WARN
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
