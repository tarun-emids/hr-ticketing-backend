services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hrdesk
      POSTGRES_USER: hrdesk
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrdesk -d hrdesk"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    restart: unless-stopped

  backend:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://hrdesk:local-development-only@db:5432/hrdesk
      ATTACHMENT_SIGNING_KEY: local-development-only-change-before-production
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      TRACE_ENABLED: "false"
      RAG_GEMINI_API_KEY: ${RAG_GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
