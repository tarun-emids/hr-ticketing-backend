services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hrdesk
      POSTGRES_USER: hrdesk
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NOTE: schema.sql is intentionally NOT mounted into
    # /docker-entrypoint-initdb.d any more — Alembic owns the schema now
    # (see README "Schema migrations (Alembic)"; `make migrate` after `make up`).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrdesk -d hrdesk"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    restart: unless-stopped

  # One-shot: bring the schema to the latest Alembic revision before anything
  # touches the database. Idempotent — after the first run it is a no-op that
  # only re-reads alembic_version; later revisions land on `make migrate`.
  migrate-init:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://hrdesk:local-development-only@db:5432/hrdesk
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # One-shot (PR #12): password-initialize the demo personas that lack a
  # password — never touches existing passwords. Skips quietly when the
  # personas are not yet provisioned.
  demo-init:
    build:
      context: .
    command: ["python", "scripts/initialize_local_demo_passwords.py"]
    environment:
      DATABASE_URL: postgresql://hrdesk:local-development-only@db:5432/hrdesk
      HR_DESK_TEMP_PASSWORD: ${HR_DESK_TEMP_PASSWORD:-ChangeMe123!}
    depends_on:
      migrate-init:
        condition: service_completed_successfully
    restart: "no"

  # One-shot (PR #13): seed missing policy documents without touching
  # existing ones (--missing-only) and without embedding churn (--skip-chunks;
  # run scripts/seed_knowledge_base.py manually for fresh citable chunks).
  kb-init:
    build:
      context: .
    command: ["python", "scripts/seed_knowledge_base.py", "--missing-only", "--skip-chunks"]
    environment:
      DATABASE_URL: postgresql://hrdesk:local-development-only@db:5432/hrdesk
    depends_on:
      migrate-init:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://hrdesk:local-development-only@db:5432/hrdesk
      ATTACHMENT_SIGNING_KEY: local-development-only-change-before-production
      AUTH_SIGNING_KEY: local-development-only-change-before-production
      MAILPIT_HOST: mailpit
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      TRACE_ENABLED: "false"
      RAG_GEMINI_API_KEY: ${RAG_GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      demo-init:
        condition: service_completed_successfully
      kb-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
